# cargo-about 設定：產生安裝包裡的 THIRD-PARTY-RUST.html（Rust 套件的完整授權條文）
#   cargo about generate --fail about.hbs -o THIRD-PARTY-RUST.html

# 三個發佈平台的相依套件都要列進去
targets = ["x86_64-pc-windows-gnu", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    # 本專案
    "GPL-3.0-or-later",
    # libmpv2-sys（libmpv 的綁定）
    "LGPL-2.1",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "CDLA-Permissive-2.0",
]
