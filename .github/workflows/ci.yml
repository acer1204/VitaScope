name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 測試（${{ matrix.os }}${{ matrix.libmpv && '，AppImage 的 libmpv' || '' }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          # AppImage 內含的 libmpv（本專案建置）；上面的 ubuntu-latest 測系統的 libmpv（tar.gz 用的）
          - os: ubuntu-24.04
            libmpv: vendor
    runs-on: ${{ matrix.os }}
    env:
      VITASCOPE_LIBMPV: ${{ matrix.libmpv }}
    steps:
      - uses: actions/checkout@v5

      # Windows 用 GNU 工具鏈（跟本機開發相同，直接連結 libmpv.dll.a）
      - name: 安裝 Rust（Windows GNU）
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - name: 安裝 Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # 兩個 Linux 工作連結的 libmpv 不同，不共用快取
          key: ${{ matrix.libmpv }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # libmpv（播放引擎）+ FFmpeg（產生測試樣本）+ 截圖檢查用的虛擬螢幕
      - name: 安裝 libmpv 與 FFmpeg（Linux）
        if: runner.os == 'Linux'
        # 套件伺服器偶爾卡住，預設要等 6 小時才會逾時
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxi6 libwayland-cursor0 libwayland-egl1
          if [ "$VITASCOPE_LIBMPV" = vendor ]; then
            bash scripts/fetch-libmpv.sh
            sudo apt-get install -y ffmpeg   # 也帶進 libva2、libpulse0
          else
            sudo apt-get install -y libmpv-dev ffmpeg
          fi
      - name: 安裝 libmpv 與 FFmpeg（macOS）
        if: runner.os == 'macOS'
        run: |
          bash scripts/fetch-libmpv.sh
          # FFmpeg 只用來產生測試樣本（Homebrew 的 FFmpeg dylib 跟靜態連結在 libmpv 裡的互不干擾）
          brew install ffmpeg
      - name: 安裝 libmpv 與 FFmpeg（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          choco install ffmpeg-full -y --no-progress

      - name: 版本資訊
        shell: bash
        run: |
          rustc --version
          ffmpeg -hide_banner -version | head -n 1

      - name: 產生測試樣本
        run: python scripts/gen_samples.py

      # 格式矩陣、播放核心、介面測試都是 headless，不需要 GPU；
      # 硬體解碼測試（tests/hwdec.rs）需要 GPU，只在本機跑
      - name: 測試
        # 播放引擎卡住時（例如 DASH 分離器無限循環）測試程式會一直等，不要拖到整個工作逾時
        timeout-minutes: 30
        run: cargo test --all-targets -- --nocapture

      # 真的開視窗截圖：亮度 +50 時畫面要比較亮（系統的 libmpv、本專案建置的各跑一次；
      # llvmpipe 會自動改用軟體繪圖的簡化流程，兩種流程都比）
      - name: 影像調整的截圖檢查（Linux，虛擬螢幕）
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test --test picture_shot -- --ignored --nocapture --test-threads=1

      - name: 建置發佈版
        run: cargo build --release
