name: libmpv（Windows）

# Windows 版播放引擎 libmpv-2.dll：自己從原始碼建置（mpv -Dgpl=false + FFmpeg LGPL、不含 libzvbi、
# 每個元件固定版本並核對雜湊），連同完整對應原始碼發佈成 prerelease libmpv-win64-<build_id>，
# 給 scripts/fetch-libmpv.ps1 下載。版本在 packaging/windows/libmpv/pins.json；改了就把 build_id 加一。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 建置與測試通過後發佈成 prerelease
        type: boolean
        default: false
      repro_check:
        description: 建置兩次，確認 libmpv-2.dll 逐位元相同
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: libmpv-windows
  cancel-in-progress: false

jobs:
  sources:
    name: 原始碼包
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: id
        run: echo "id=vitascope-libmpv-win64-$(jq -r .build_id packaging/windows/libmpv/pins.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/libmpv-sources
          key: libmpv-sources-${{ hashFiles('packaging/windows/libmpv/pins.json') }}
      - name: 取得並核對每個元件的原始碼
        run: bash packaging/windows/libmpv/fetch-sources.sh ~/.cache/libmpv-sources "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-src
          path: ${{ runner.temp }}/out/${{ steps.id.outputs.id }}-src.tar.xz
          compression-level: 0
          if-no-files-found: error

  build:
    name: 建置（${{ matrix.copy }}）
    needs: sources
    strategy:
      matrix:
        copy: ${{ fromJSON(inputs.repro_check && '[1, 2]' || '[1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ID: ${{ needs.sources.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-src
          path: ${{ runner.temp }}
      - name: 主機工具
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkgconf autoconf automake libtool make jq zip xz-utils
          # nasm 會影響組合語言的輸出：版本變了先確認，再改這裡
          test "$(dpkg-query -W -f='${Version}' nasm)" = "2.16.01-1build1"
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --only-binary=:all: --require-hashes -r packaging/windows/libmpv/requirements.txt
          echo /opt/venv/bin >> "$GITHUB_PATH"
          sudo mkdir -p /opt/vsbuild /opt/llvm-mingw
          sudo chown "$USER" /opt/vsbuild /opt/llvm-mingw
          tar -xf "$RUNNER_TEMP/$ID-src.tar.xz" -C /opt/vsbuild
      - uses: actions/cache@v4
        with:
          path: ~/.cache/llvm-mingw
          key: llvm-mingw-${{ hashFiles('packaging/windows/libmpv/pins.json') }}
      - name: 工具鏈（llvm-mingw，核對 SHA-256）
        run: |
          pins=/opt/vsbuild/$ID-src/pins.json
          url=$(jq -r .toolchain.url "$pins"); sha=$(jq -r .toolchain.sha256 "$pins")
          mkdir -p ~/.cache/llvm-mingw; f=~/.cache/llvm-mingw/${url##*/}
          [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "$url"
          echo "$sha  $f" | sha256sum -c
          tar -xf "$f" -C /opt/llvm-mingw --strip-components=1
      - name: 建置
        run: bash "/opt/vsbuild/$ID-src/build/build.sh" /opt/llvm-mingw "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-win64-${{ matrix.copy }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/imports.txt
            ${{ runner.temp }}/dist/exports.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libmpv-logs-${{ matrix.copy }}
          path: ${{ runner.temp }}/dist/logs/
          if-no-files-found: ignore

  reproducible:
    name: 兩次建置是否相同
    if: inputs.repro_check
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libmpv-win64-*
          path: r
      - run: diff r/libmpv-win64-1/SHA256SUMS r/libmpv-win64-2/SHA256SUMS && cat r/libmpv-win64-1/SHA256SUMS

  test:
    name: 測試（Windows）
    needs: [sources, build]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      ID: ${{ needs.sources.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - name: 安裝 Rust（Windows GNU）
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-win64-1
          path: built
      - name: 換上新建置的 libmpv
        shell: pwsh
        run: |
          $dest = "vendor/libmpv/windows-x64"
          New-Item -ItemType Directory -Force $dest | Out-Null
          tar -xf "built/$env:ID.zip" -C $dest
          if ($LASTEXITCODE -ne 0) { throw "解壓失敗" }
          # 只能依賴 Windows 內建的 DLL
          $extra = Get-Content built/imports.txt | Where-Object {
            $_ -notlike 'api-ms-win-*' -and -not (Test-Path "$env:SystemRoot\System32\$_") }
          if ($extra) { throw "libmpv-2.dll 依賴 Windows 沒有內建的 DLL：$($extra -join ', ')" }
          "libmpv-2.dll：{0:N1} MB" -f ((Get-Item "$dest/libmpv-2.dll").Length / 1MB)
      - name: 安裝 FFmpeg（只用來產生測試樣本）
        run: choco install ffmpeg-full -y --no-progress
      - name: 產生測試樣本
        run: python scripts/gen_samples.py
      - name: 測試
        run: cargo test --all-targets -- --nocapture
      - name: 版本
        shell: pwsh
        run: |
          cargo build --release
          ./target/release/vitascope.exe --version

  publish:
    name: 發佈
    if: inputs.publish
    needs: [sources, build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ID: ${{ needs.sources.outputs.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-src
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-win64-1
          path: built
      - name: 編譯器執行庫的原始碼（libc++、libunwind、compiler-rt、mingw-w64）
        run: bash packaging/windows/libmpv/fetch-sources.sh --toolchain ~/.cache/libmpv-toolchain-src assets
      - name: 建立 prerelease
        run: |
          tag=${ID#vitascope-}
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag 已經發佈過；改了 pins.json 要把 build_id 加一"; exit 1
          fi
          cp "built/$ID.zip" assets/
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          p=packaging/windows/libmpv/pins.json
          mpv=$(jq -r '.components[] | select(.name=="mpv") | .version' $p)
          ffmpeg=$(jq -r '.components[] | select(.name=="ffmpeg") | .version' $p)
          cat > notes.md <<EOF
          Windows 版影戲 VitaScope 使用的播放引擎 \`libmpv-2.dll\`（x86_64）。**這不是影戲的新版本**，一般使用者請下載最新的影戲版本。

          - mpv $mpv（\`-Dgpl=false\`）、FFmpeg $ffmpeg（LGPL）；其餘元件與版本見 zip 裡的 \`THIRD-PARTY-WINDOWS.md\`
          - 授權：LGPL-2.1-or-later，各元件的授權條文在 zip 的 \`licenses/\`
          - \`$ID.zip\`：libmpv-2.dll、libmpv.dll.a、include/mpv、授權聲明、BUILDINFO.txt
          - \`$ID-src.tar.xz\`：完整對應原始碼（各元件原始碼、建置腳本與設定），\`bash build/build.sh <llvm-mingw> <輸出>\` 可重新建置
          - \`llvm-project-*.src.tar.xz\`、\`mingw-w64-*.tar.xz\`、\`llvm-mingw-*.tar.xz\`：靜態連結進 DLL 的編譯器執行庫與工具鏈腳本
          - 建置紀錄：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" assets/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "libmpv-2.dll（Windows x64）$tag" --notes-file notes.md
