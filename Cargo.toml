[package]
name = "vitascope"
version = "0.3.0"
edition = "2024"
description = "影戲 — 跨平台影片播放器：libmpv 引擎 + egui 介面"
authors = ["acer1204"]
license = "GPL-3.0-or-later"
repository = "https://github.com/acer1204/VitaScope"
homepage = "https://github.com/acer1204/VitaScope"
readme = "README.md"
keywords = ["video", "player", "mpv", "media"]
categories = ["multimedia::video"]

[dependencies]
# 外掛字幕的編碼偵測（Firefox 的偵測器，擅長 Big5 / GBK / Shift_JIS 這類舊編碼）與轉碼
chardetng = "1"
encoding_rs = "0.8"
# glow（OpenGL）後端：mpv 的 render API 只支援 OpenGL，要和 egui 共用同一個 GL context
# 不開 persistence：設定（含視窗位置）自己存，見 src/settings.rs
# links：「關於」視窗的超連結、檢查更新後開啟下載頁面
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
    "accesskit",
    "links",
] }
# 只用底層綁定，安全包裝自己寫（src/mpv/）
libmpv2-sys = "4"
png = "0.18"
# 開檔對話框的擁有者（主視窗）；eframe、rfd 也是用這個版本
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 檢查更新（查詢 GitHub Releases）
ureq = "3"
# 網址的解析（主機名稱、帳號密碼、查詢參數）；本來就在相依樹裡（webbrowser 用的）
url = "2.5.8"

# Windows：系統的「圖片」資料夾（可能被 OneDrive 搬走，要問系統）
[target.'cfg(windows)'.dependencies]
# 單一執行個體：具名管道、使用者 SID（只讓同一個使用者連線）、把前景交給已開啟的視窗
# 流暢播放：螢幕的精確更新率（QueryDisplayConfig）、電源（GetSystemPowerStatus）
# 網站影片：yt-dlp 放進 Job Object（取消、結束影戲時連它開的子程序一起結束）
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS：Finder 開檔送來的 Apple Event（winit 沒有提供）
[target.'cfg(unix)'.dependencies]
# 單一執行個體：確認放 socket 的資料夾是自己的（geteuid）
libc = "0.2"

# Linux（X11）：啟動時查有哪些螢幕（上次的視窗位置在拔掉的螢幕上時不還原）；winit 本來就用它
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 啟動時查有哪些螢幕（NSScreen）；視窗所在螢幕的編號（NSView → NSWindow → NSScreen.deviceDescription）
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSDictionary",
    "NSEnumerator",
    "NSNotification",
    "NSString",
    "NSURL",
    "NSValue",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# 開發時讓相依套件也用最佳化編譯，介面才不會卡
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
